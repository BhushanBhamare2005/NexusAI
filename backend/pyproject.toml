[project]
name = "paytm-nexus-ai-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "aiosqlite==0.20.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "langgraph==0.2.35",
    "langchain==0.3.3",
    "langchain-google-genai==2.0.0",
    "python-jose[cryptography]==3.3.0",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "bcrypt==4.2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
